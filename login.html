<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Login - Hygenix Community</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root { --primary: #10b981; --bg: #f8fafc; --teks: #1e293b; --teks-muted: #64748b; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    
    .login-container { width: 100%; max-width: 400px; padding: 30px 20px; background: white; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; margin: 20px; }
    
    .logo-img { width: 80px; height: 80px; object-fit: contain; margin-bottom: 15px; }
    .app-title { font-size: 24px; font-weight: 700; color: var(--primary); margin-bottom: 5px; }
    .app-subtitle { font-size: 12px; color: var(--teks-muted); margin-bottom: 30px; letter-spacing: 1px; }

    .form-group { margin-bottom: 15px; text-align: left; }
    .form-group label { font-size: 12px; font-weight: 600; color: var(--teks); margin-bottom: 5px; display: block; }
    .form-group input { width: 100%; padding: 12px 15px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 14px; outline: none; transition: 0.2s; }
    .form-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1); }

    .btn-login { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 10px; transition: 0.2s; }
    .btn-login:active { transform: scale(0.98); }
    .btn-login:disabled { background: #94a3b8; cursor: not-allowed; }

    .error-msg { background: #fee2e2; color: #991b1b; font-size: 12px; padding: 10px; border-radius: 8px; margin-bottom: 15px; display: none; text-align: left; }
  </style>
</head>
<body>

  <div class="login-container">
    <!-- Pastikan file icon.png ada di folder yang sama -->
    <img src="icon.png" alt="Hygenix Logo" class="logo-img" onerror="this.src='https://via.placeholder.com/80?text=H'">
    <div class="app-title">Hygenix</div>
    <div class="app-subtitle">COMMUNITY</div>

    <div id="errorBox" class="error-msg"></div>

    <form id="loginForm">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="Masukkan email Anda" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-login" id="btnLogin">Masuk ke Aplikasi</button>
    </form>
  </div>

  <script>
    // KONFIGURASI SUPABASE
    const SUPABASE_URL = 'https://konopkunbtcwnbbdiqxv.supabase.co'; 
    const SUPABASE_KEY = 'sb_publishable_LJHT38ry69jKpn8ux0I8SA_qtN0d-x3';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btnLogin');
      const errorBox = document.getElementById('errorBox');

      // Ubah tampilan tombol saat loading
      btn.disabled = true;
      btn.innerText = 'Memproses...';
      errorBox.style.display = 'none';

      // Proses Login ke Supabase
      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password,
      });

      if (error) {
        // Jika gagal login, tampilkan kotak merah (bukan popup hitam)
        errorBox.innerText = "Gagal: " + error.message;
        errorBox.style.display = 'block';
        btn.disabled = false;
        btn.innerText = 'Masuk ke Aplikasi';
      } else {
        // Jika berhasil, ubah teks tombol dan langsung pindah halaman TANPA ALERT
        btn.innerText = 'Berhasil! Mengalihkan...';
        btn.style.background = '#059669'; // Warna hijau lebih gelap
        window.location.href = 'index.html'; 
      }
    });
  </script>
</body>
</html>
